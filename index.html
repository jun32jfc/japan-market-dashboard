[/MACD/,v=>({guide:'MACDがシグナル線を上抜くと上向き、下抜くと下向きの参考。ゼロラインも確認。',judge:'MACD単独値では判定不可',note:'シグナル線・ヒストグラム・前日比がないと方向性を判断できない。'})],

function explain(name,value){const r=rules.find(([rx])=>rx.test(name));const x=r?r[1](value):{guide:'過去平均・変化率・関連指標と比較して評価する。',judge:'比較情報が必要',note:'単一の数値だけで投資判断をしない。'};const missing=/未取得|公表元を確認/.test(value);return '<div class="explain '+(missing?'unknown':'')+'"><strong>評価：'+x.judge+'</strong><div class="guide">目安：'+x.guide+'</div><div>'+x.note+'</div></div>'}
const tabs=document.getElementById('tabs'),panels=document.getElementById('panels');Object.entries(data).forEach(([name,items],i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>show(i);tabs.append(b);const sec=document.createElement('section');sec.innerHTML='<div class="grid">'+items.map(x=>'<article class="card"><span class="pill">'+name+'</span><div style="margin-top:9px">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="sub '+(x[2].startsWith('-')?'down':'')+'">'+x[2]+'</div><div class="date">基準日：'+x[3]+'</div><a target="_blank" rel="noopener" href="'+x[4]+'">出典を開く ↗</a>'+explain(x[0],x[1])+'</article>').join('')+'</div>';panels.append(sec)});const b=document.createElement('button');b.textContent='全データ取得先';b.onclick=()=>show(Object.keys(data).length);tabs.append(b);const sec=document.createElement('section');sec.innerHTML='<h2>無料公開URL・項目別取得先</h2><table><thead><tr><th>項目</th><th>公開元</th><th>更新区分</th></tr></thead><tbody>'+sources.map(x=>'<tr><td>'+x[0]+'</td><td><a target="_blank" rel="noopener" href="'+x[2]+'">'+x[1]+' ↗</a></td><td>'+x[3]+'</td></tr>').join('')+'</tbody></table>';panels.append(sec);function show(i){[...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));[...panels.children].forEach((s,j)=>s.classList.toggle('active',i===j))}show(0);</script></body></html>
